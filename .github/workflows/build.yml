name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Run game tests (loads the mod together with ProjectE on a headless server)
        run: ./gradlew runGameTestServer --no-daemon
        timeout-minutes: 20

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: peqol-jar
          path: build/libs/*.jar

      - name: Game test summary
        if: always()
        run: |
          grep -hE "GameTest|tests? (passed|failed)|required tests|peqol" run/logs/latest.log | tail -n 40 || true
